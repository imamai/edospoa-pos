<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mejason POS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
:root{--red:#E31E24;--dark:#0f0f0f;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--text:#f0f0f0;--muted:#777;--green:#22c55e;--amber:#f59e0b;--blue:#3b82f6;--purple:#8b5cf6}
body{background:var(--dark);color:var(--text);font-size:13px}

/* LOGIN */
#login-screen{position:fixed;inset:0;background:var(--dark);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:0}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:36px 40px;width:360px}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;justify-content:center}
.login-icon{width:44px;height:44px;background:var(--red);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px}
.login-title{font-size:16px;font-weight:700;line-height:1.2}
.login-title span{color:var(--red);font-size:11px;display:block;font-weight:400}
.login-field{margin-bottom:14px}
.login-field label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}
.login-field input,.login-field select{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px}
.login-err{color:#f87171;font-size:12px;margin-bottom:10px;text-align:center;min-height:16px}
.btn-login{width:100%;padding:11px;background:var(--red);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
.btn-login:hover{background:#c0181d}

/* LAYOUT */
#app{display:none;height:100vh;overflow:hidden;flex-direction:column}
#app.show{display:flex}
.topbar{height:50px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
.topbar-brand{display:flex;align-items:center;gap:8px;min-width:180px}
.tb-icon{width:28px;height:28px;background:var(--red);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px}
.topbar-title{font-size:13px;font-weight:700;flex:1;padding-left:12px}
.topbar-info{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:14px}
.user-chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 10px;font-size:12px}
.user-dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.body-wrap{display:flex;flex:1;overflow:hidden}
.sidebar{width:185px;min-width:185px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:8px 0}
.nav-section{font-size:9px;color:var(--muted);padding:10px 14px 3px;text-transform:uppercase;letter-spacing:.6px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 14px;cursor:pointer;color:var(--muted);font-size:12px;border-left:3px solid transparent;transition:all .12s}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.03)}
.nav-item.active{color:var(--red);border-left-color:var(--red);background:rgba(227,30,36,.07)}
.nav-item i{font-size:15px}
.nav-item .badge-pill{margin-left:auto;background:var(--red);color:#fff;font-size:9px;padding:1px 6px;border-radius:10px}
.main{flex:1;overflow-y:auto;padding:16px}
.page{display:none}.page.active{display:block}

/* COMPONENTS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:500;transition:all .12s}
.btn-red{background:var(--red);color:#fff}.btn-red:hover{background:#c0181d}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-outline:hover{background:rgba(255,255,255,.05)}
.btn-green{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.3)}.btn-green:hover{background:rgba(34,197,94,.25)}
.btn-sm{padding:5px 10px;font-size:11px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.card-title{font-size:12px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;color:var(--text)}
.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;border-top:3px solid}
.stat-label{font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.stat-value{font-size:19px;font-weight:700;line-height:1}
.stat-sub{font-size:10px;color:var(--muted);margin-top:3px}
.table{width:100%;border-collapse:collapse}
.table th{font-size:10px;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.3px}
.table td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.03);font-size:12px;vertical-align:middle}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:500}
.badge-green{background:rgba(34,197,94,.12);color:#4ade80}
.badge-amber{background:rgba(245,158,11,.12);color:#fbbf24}
.badge-red{background:rgba(227,30,36,.12);color:#f87171}
.badge-blue{background:rgba(59,130,246,.12);color:#60a5fa}
.badge-purple{background:rgba(139,92,246,.12);color:#a78bfa}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
input,select,textarea{background:var(--card);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text);font-size:12px;width:100%}
input:focus,select:focus{outline:1px solid var(--red);border-color:var(--red)}
label{font-size:10px;color:var(--muted);display:block;margin-bottom:3px}

/* POS */
.pos-wrap{display:grid;grid-template-columns:1fr 330px;gap:14px;height:calc(100vh - 82px)}
.svc-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.dept-tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);flex-shrink:0}
.dept-tab{padding:9px 13px;font-size:11px;font-weight:500;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:5px}
.dept-tab.active{color:var(--red);border-bottom-color:var(--red)}
.svc-list{flex:1;overflow-y:auto;padding:10px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.svc-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;cursor:pointer;transition:all .12s}
.svc-card:hover{border-color:var(--red);background:rgba(227,30,36,.05)}
.svc-name{font-size:11px;font-weight:600;margin-bottom:2px;line-height:1.3}
.svc-desc{font-size:9px;color:var(--muted);margin-bottom:5px;line-height:1.4}
.svc-price{font-size:13px;font-weight:700;color:var(--red)}
.svc-dept{font-size:9px;color:var(--muted);margin-bottom:3px}

/* CART */
.cart-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;overflow:hidden}
.cart-hdr{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600}
.cart-info{padding:10px 12px;border-bottom:1px solid var(--border);display:grid;gap:7px}
.cart-row-info{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.cart-items{flex:1;overflow-y:auto;padding:8px 12px}
.c-item{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.c-item-name{flex:1;font-size:11px;line-height:1.3}
.c-item-sub{font-size:9px;color:var(--muted)}
.c-item-price{font-size:11px;font-weight:600;color:var(--red);min-width:60px;text-align:right}
.c-remove{color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.c-remove:hover{color:#f87171}
.cart-foot{padding:10px 12px;border-top:1px solid var(--border)}
.cf-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;color:var(--muted)}
.cf-total{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin:7px 0 10px}
.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px}
.pay-btn{padding:7px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-size:10px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px;transition:all .12s}
.pay-btn.active,.pay-btn:hover{border-color:var(--red);color:var(--red);background:rgba(227,30,36,.08)}

/* MPESA */
.mpesa-box{background:rgba(34,197,94,.06);border:1px solid rgba(34,197,94,.2);border-radius:8px;padding:12px;margin-bottom:8px}
.mpesa-box label{color:#4ade80;font-size:10px}
.mpesa-status{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:6px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(34,197,94,.3);border-top-color:#4ade80;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* DEPT REPORT */
.dept-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.dept-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;border-left:3px solid}
.dept-card-name{font-size:11px;color:var(--muted);margin-bottom:4px}
.dept-card-val{font-size:18px;font-weight:700}
.dept-card-sub{font-size:10px;color:var(--muted);margin-top:3px}

/* USERS */
.users-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.user-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.u-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;margin-bottom:8px}
.u-name{font-size:13px;font-weight:600}
.u-role{font-size:10px;margin-top:2px}
.u-perms{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:999}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:480px;max-height:86vh;overflow-y:auto}
.modal-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:13px}

/* PROGRESS BAR */
.prog-wrap{height:5px;background:var(--border);border-radius:4px;overflow:hidden}
.prog-bar{height:5px;background:var(--red);border-radius:4px;transition:width .3s}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-icon">M</div>
      <div class="login-title">Mejason Media Production<span>Point of Sale System</span></div>
    </div>
    <div class="login-field"><label>Username</label><input id="li-user" placeholder="Enter username" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div class="login-field"><label>Password</label><input id="li-pass" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div class="login-err" id="li-err"></div>
    <button class="btn-login" onclick="doLogin()">Sign In</button>
    <div style="text-align:center;margin-top:14px;font-size:10px;color:var(--muted)">Demo: admin/admin &nbsp;|&nbsp; cashier/cashier &nbsp;|&nbsp; manager/manager</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="tb-icon">M</div>
      <span style="font-size:12px;font-weight:700">mejasan <span style="color:var(--red)">POS</span></span>
    </div>
    <div class="topbar-title" id="page-title">Dashboard</div>
    <div class="topbar-info">
      <span id="tb-date" style="font-size:11px;color:var(--muted)"></span>
      <div class="user-chip"><div class="user-dot"></div><span id="tb-user">—</span> <span id="tb-role" style="color:var(--muted)"></span></div>
      <button class="btn btn-sm btn-red" onclick="nav('pos',0)"><i class="ti ti-plus"></i> New Sale</button>
      <button class="btn btn-sm btn-outline" onclick="logout()"><i class="ti ti-logout"></i></button>
    </div>
  </div>
  <div class="body-wrap">
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="page active" id="page-dashboard"></div>
      <div class="page" id="page-pos"></div>
      <div class="page" id="page-invoices"></div>
      <div class="page" id="page-clients"></div>
      <div class="page" id="page-inventory"></div>
      <div class="page" id="page-reports"></div>
      <div class="page" id="page-users"></div>
      <div class="page" id="page-settings"></div>
    </div>
  </div>
</div>

<!-- Invoice Modal -->
<div class="modal-bg" id="inv-modal">
  <div class="modal">
    <div class="modal-hdr"><span><i class="ti ti-file-invoice" style="color:var(--red)"></i> Invoice</span><button class="btn btn-outline btn-sm" onclick="closeModal('inv-modal')"><i class="ti ti-x"></i></button></div>
    <div style="padding:18px" id="inv-modal-body"></div>
  </div>
</div>

<!-- Add Client Modal -->
<div class="modal-bg" id="client-modal">
  <div class="modal">
    <div class="modal-hdr"><span><i class="ti ti-user-plus" style="color:var(--red)"></i> Add / Edit Client</span><button class="btn btn-outline btn-sm" onclick="closeModal('client-modal')"><i class="ti ti-x"></i></button></div>
    <div style="padding:18px;display:grid;gap:10px">
      <div><label>Full Name *</label><input id="cl-name" placeholder="e.g. John Otieno"/></div>
      <div class="two-col">
        <div><label>Phone *</label><input id="cl-phone" placeholder="+254 7XX XXX XXX"/></div>
        <div><label>Email</label><input id="cl-email" placeholder="client@email.com"/></div>
      </div>
      <div><label>Event Type</label><input id="cl-event" placeholder="e.g. Wedding, Graduation…"/></div>
      <div><label>Notes</label><textarea id="cl-notes" rows="2" style="resize:none"></textarea></div>
      <button class="btn btn-red" onclick="saveClient()"><i class="ti ti-check"></i> Save Client</button>
    </div>
  </div>
</div>

<!-- M-Pesa STK Modal -->
<div class="modal-bg" id="mpesa-modal">
  <div class="modal" style="width:380px">
    <div class="modal-hdr"><span style="color:#4ade80"><i class="ti ti-device-mobile"></i> M-Pesa STK Push</span><button class="btn btn-outline btn-sm" onclick="closeModal('mpesa-modal')"><i class="ti ti-x"></i></button></div>
    <div style="padding:18px" id="mpesa-modal-body"></div>
  </div>
</div>

// ── AUTH ────────────────────────────────────────────────
function doLogin() {
  const u = document.getElementById('li-user').value.trim();
  const p = document.getElementById('li-pass').value;
  const user = USERS.find(x => x.username === u && x.password === p);
  if(!user){ document.getElementById('li-err').textContent = 'Invalid username or password.'; return; }
  currentUser = user;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').classList.add('show');
  document.getElementById('tb-user').textContent = user.name;
  document.getElementById('tb-role').textContent = '· ' + user.role;
  buildSidebar();
  renderDashboard();
  nav('dashboard',0);
  setInterval(()=>{ document.getElementById('tb-date').textContent = dateStr() + ' ' + timeStr(); }, 1000);
  document.getElementById('tb-date').textContent = dateStr() + ' ' + timeStr();
}
function logout(){ currentUser=null; document.getElementById('app').classList.remove('show'); document.getElementById('login-screen').style.display='flex'; document.getElementById('li-pass').value=''; document.getElementById('li-err').textContent=''; }

function buildSidebar() {
  const p = currentUser.perms;
  const items = [
    {key:'dashboard',icon:'ti-layout-dashboard',label:'Dashboard',section:'Main'},
    {key:'pos',icon:'ti-shopping-cart',label:'New Sale',section:null},
    {key:'invoices',icon:'ti-file-invoice',label:'Invoices',section:'Records'},
    {key:'clients',icon:'ti-users',label:'Clients',section:null},
    {key:'inventory',icon:'ti-package',label:'Inventory',section:null},
    {key:'reports',icon:'ti-chart-bar',label:'Reports',section:'Analytics'},
    {key:'users',icon:'ti-shield-lock',label:'Users & Access',section:'Admin'},
    {key:'settings',icon:'ti-settings',label:'Settings',section:null},
  ];
  let html='', lastSection='';
  items.forEach(it => {
    if(!p.includes(it.key)) return;
    if(it.section && it.section !== lastSection){ html+=`<div class="nav-section">${it.section}</div>`; lastSection=it.section; }
    html+=`<div class="nav-item" id="nav-${it.key}" onclick="nav('${it.key}',1)"><i class="ti ${it.icon}"></i>${it.label}</div>`;
  });
  document.getElementById('sidebar').innerHTML = html;
}

function nav(page, scroll) {
  if(!currentUser || !currentUser.perms.includes(page)) return;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  const el = document.getElementById('nav-'+page);
  if(el) el.classList.add('active');
  const titles={dashboard:'Dashboard',pos:'New Sale',invoices:'Invoices',clients:'Clients',inventory:'Inventory',reports:'Reports & Departments',users:'Users & Access',settings:'Settings'};
  document.getElementById('page-title').textContent = titles[page]||page;
  if(page==='dashboard') renderDashboard();
  if(page==='pos') renderPOS();
  if(page==='invoices') renderInvoices();
  if(page==='clients') renderClients();
  if(page==='inventory') renderInventory();
  if(page==='reports') renderReports();
  if(page==='users') renderUsers();
  if(page==='settings') renderSettings();
  if(scroll) document.querySelector('.main').scrollTop=0;
}

function renderDashboard() {

  const todayRev = todayInvs.reduce((a,i)=>a+i.total,0);

  const deptTotals = {};
  invoices.forEach(inv=>inv.items.forEach(item=>{ deptTotals[item.dept]=(deptTotals[item.dept]||0)+item.price*item.qty; }));

  document.getElementById('page-dashboard').innerHTML = `
    <div class="stats-grid">
      <div class="stat-card" style="border-top-color:var(--red)"><div class="stat-label">Total Revenue</div><div class="stat-value">${fmt(total)}</div><div class="stat-sub">${invoices.length} invoices</div></div>
      <div class="stat-card" style="border-top-color:var(--green)"><div class="stat-label">Paid</div><div class="stat-value">${fmt(paid)}</div><div class="stat-sub">Collected</div></div>
      <div class="stat-card" style="border-top-color:var(--amber)"><div class="stat-label">Unpaid / Credit</div><div class="stat-value">${fmt(unpaid)}</div><div class="stat-sub">Outstanding</div></div>
      <div class="stat-card" style="border-top-color:var(--blue)"><div class="stat-label">Today's Sales</div><div class="stat-value">${fmt(todayRev)}</div><div class="stat-sub">${todayInvs.length} transactions</div></div>
      <div class="stat-card" style="border-top-color:var(--purple)"><div class="stat-label">Clients</div><div class="stat-value">${clients.length}</div><div class="stat-sub">Registered</div></div>
    </div>
    <div class="two-col" style="margin-bottom:14px">
      <div class="card">
        <div class="card-title"><i class="ti ti-receipt" style="color:var(--red)"></i> Recent Transactions</div>
        <table class="table"><thead><tr><th>Invoice</th><th>Client</th><th>Dept</th><th>Amount</th><th>Status</th></tr></thead>
        <tbody>${!invoices.length?'<tr><td colspan="5" style="color:var(--muted);text-align:center;padding:16px">No transactions yet</td></tr>':
          [...invoices].reverse().slice(0,6).map(i=>`<tr>
            <td style="color:var(--muted);font-size:10px">${i.id}</td>
            <td>${i.clientName}</td>
            <td><span style="font-size:10px;color:var(--muted)">${[...new Set(i.items.map(x=>x.dept))].join(', ')}</span></td>

            <td><span class="badge ${i.status==='Paid'?'badge-green':'badge-red'}">${i.status}</span></td>

        ${renderDeptBars(deptTotals)}
      </div>
    </div>`;
}

function renderDeptBars(deptTotals) {
  const entries = Object.entries(deptTotals);
  if(!entries.length) return '<div style="color:var(--muted);font-size:12px;text-align:center;padding:16px">No data yet</div>';
  const max = Math.max(...entries.map(e=>e[1]));
  return entries.map(([d,v])=>{
    const dept = DEPTS.find(x=>x.id===d)||{name:d,color:'#888'};
    return `<div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px"><span style="display:flex;align-items:center;gap:5px"><span style="width:8px;height:8px;border-radius:50%;background:${dept.color};display:inline-block"></span>${dept.name}</span><span style="color:var(--muted)">${fmt(v)}</span></div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${Math.round(v/max*100)}%;background:${dept.color}"></div></div>
    </div>`;
  }).join('');
}

function filterDept(dept, el) {
  activeDept = dept;
  document.querySelectorAll('.dept-tab').forEach(t=>{t.classList.remove('active');t.style.color='';t.style.borderBottomColor='';});
  el.classList.add('active');
  const d = DEPTS.find(x=>x.id===dept);
  if(d){ el.style.color=d.color; el.style.borderBottomColor=d.color; }
  const filtered = dept==='all'?SERVICES:SERVICES.filter(s=>s.dept===dept);
  document.getElementById('svc-grid').innerHTML = filtered.map(s=>{
    const dd=DEPTS.find(x=>x.id===s.dept)||{color:'#888',name:s.dept};
    return `<div class="svc-card" onclick="addToCart('${s.id}')">
      <div class="svc-dept" style="color:${dd.color}">${dd.name}</div>
      <div class="svc-name">${s.name}</div>
      <div class="svc-desc">${s.desc}</div>
      <div class="svc-price">${fmt(s.price)}</div>
    </div>`;}).join('');
}

function addToCart(id) {
  const s = SERVICES.find(x=>x.id===id); if(!s) return;
  const ex = cart.find(c=>c.id===id);
  if(ex) ex.qty++; else cart.push({...s,qty:1});
  updateCartUI();
}
function removeCart(id) { cart=cart.filter(c=>c.id!==id); updateCartUI(); }
function updateCartUI() {
  const el = document.getElementById('cart-items');
  if(!el) return;
  document.getElementById('cart-count-lbl').textContent = cart.length+' item'+(cart.length!==1?'s':'');
  if(!cart.length){ el.innerHTML='<div style="color:var(--muted);font-size:11px;text-align:center;padding:16px">Tap a service to add</div>'; recalc(); return; }
  el.innerHTML = cart.map(c=>`<div class="c-item">
    <div style="flex:1"><div class="c-item-name">${c.name}</div><div class="c-item-sub">${DEPTS.find(d=>d.id===c.dept)?.name||c.dept} · qty ${c.qty}</div></div>
    <div class="c-item-price">${fmt(c.price*c.qty)}</div>
    <span class="c-remove" onclick="removeCart('${c.id}')">×</span>
  </div>`).join('');
  recalc();
}
function recalc() {
  const sub = cart.reduce((a,c)=>a+c.price*c.qty,0);
  const disc = Math.min(parseFloat(document.getElementById('disc-pct')?.value)||0,100);
  const da = sub*disc/100;
  const total = sub-da;
  const s = document.getElementById('cf-sub'); if(s) s.textContent=fmt(sub);
  const ds = document.getElementById('cf-disc'); if(ds) ds.textContent='- '+fmt(da);
  const t = document.getElementById('cf-total'); if(t) t.textContent=fmt(total);
  return {sub,da,total,disc};
}
function selPM(pm) {
  payMethod=pm;
  ['cash','mpesa','bank','credit'].forEach(p=>{ const b=document.getElementById('pm-'+p); if(b) b.classList.toggle('active',p===pm); });
  const row = document.getElementById('mpesa-phone-row');
  if(row) row.style.display = pm==='mpesa'?'block':'none';
}
function onClientSelect(id) {
  const c = clients.find(x=>x.id===id);
  const cn = document.getElementById('cart-cname');
  const cp = document.getElementById('cart-cphone');
  if(c){ if(cn) cn.value=c.name; if(cp) cp.value=c.phone||''; }
  else { if(cn) cn.value=''; if(cp) cp.value=''; }
}

function checkout() {
  if(!cart.length){ alert('Cart is empty.'); return; }
  const {sub,da,total,disc} = recalc();
  const clientSel = document.getElementById('cart-client')?.value;
  let clientName = document.getElementById('cart-cname')?.value.trim();
  const clientPhone = document.getElementById('cart-cphone')?.value.trim();
  const eventDate = document.getElementById('cart-date')?.value;
  // Auto-generate client name if blank
  if(!clientName) clientName = 'Walk-in #' + uid();
  // Auto-save as client if phone provided and not existing
  if(clientPhone && !clientSel) {
    const existing = clients.find(c=>c.phone===clientPhone);
    if(!existing) clients.push({id:uid(),name:clientName,phone:clientPhone,email:'',event:'',notes:'',createdAt:dateStr()});
  }
  const inv = {
    id:'MMP-'+String(invoices.length+300+1).padStart(3,'0'),
    clientName, clientPhone, clientId:clientSel||null,
    items:[...cart], subtotal:sub, discountPct:disc, discountAmt:da, total,
    payMethod, status:payMethod==='credit'?'Unpaid':'Paid',
    date:dateStr(), time:timeStr(), eventDate:eventDate||dateStr(),
    cashier:currentUser.name, dept:[...new Set(cart.map(c=>c.dept))]
  };

  if(payMethod==='mpesa') {
    const phone = mpesaPhone || clientPhone;
    if(!phone){ alert('Please enter the M-Pesa phone number.'); return; }
    showMpesaSTK(inv, phone);
  } else {
    finalizeInvoice(inv);
  }
}

function showMpesaSTK(inv, phone) {
  const fmtPhone = phone.replace(/^0/,'+254').replace(/\s/g,'');
  document.getElementById('mpesa-modal-body').innerHTML = `
    <div style="text-align:center;padding:8px 0">
      <div style="font-size:32px;margin-bottom:10px">📱</div>

      <div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:8px;padding:12px;margin-bottom:14px">
        <div style="font-size:11px;color:var(--muted);margin-bottom:2px">Amount</div>
        <div style="font-size:20px;font-weight:700;color:#4ade80">${fmt(inv.total)}</div>
        <div style="font-size:10px;color:var(--muted);margin-top:4px">Paybill 522533 · Acc 7616319</div>
      </div>
      <div class="mpesa-status" style="justify-content:center"><div class="spin"></div><span>Waiting for customer to enter PIN…</span></div>
      <div style="font-size:11px;color:var(--muted);margin-top:8px">Please ask the customer to check their phone and enter their M-Pesa PIN</div>
    </div>`;
  document.getElementById('mpesa-modal').classList.add('show');
  // Simulate STK response after 4 seconds
  setTimeout(()=>{
    document.getElementById('mpesa-modal-body').innerHTML = `
      <div style="text-align:center;padding:8px 0">
        <div style="font-size:40px;margin-bottom:10px">✅</div>
        <div style="font-size:14px;font-weight:600;color:#4ade80;margin-bottom:4px">Payment Confirmed!</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:14px">M-Pesa transaction received</div>
        <div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:8px;padding:12px;margin-bottom:14px;text-align:left;font-size:12px">
          <div class="cf-row"><span>Amount Paid</span><span style="color:#4ade80;font-weight:700">${fmt(inv.total)}</span></div>
          <div class="cf-row"><span>Phone</span><span>${fmtPhone}</span></div>
          <div class="cf-row"><span>M-Pesa Ref</span><span style="color:#4ade80">SIM${uid()}</span></div>
          <div class="cf-row" style="margin:0"><span>Time</span><span>${timeStr()}</span></div>
        </div>
        <button class="btn btn-green" style="width:100%;justify-content:center" onclick="closeModal('mpesa-modal');finalizeInvoice(window._pendingInv)">
          <i class="ti ti-file-invoice"></i> View & Print Invoice
        </button>
      </div>`;
    window._pendingInv = inv;
  }, 4000);
}

function finalizeInvoice(inv) {
  invoices.push(inv);
  cart=[]; mpesaPhone='';
  showInvoice(inv);
}

function showInvoice(inv) {
  const mpesaInfo = inv.payMethod==='mpesa'?`<div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:7px;padding:9px;margin-top:8px;font-size:11px;color:#4ade80"><i class="ti ti-device-mobile"></i> M-Pesa Paybill: <strong>522533</strong> · Account: <strong>7616319</strong></div>`:'';

function markPaid(id) {
  const inv = invoices.find(i=>i.id===id); if(!inv) return;
  inv.status='Paid'; inv.paidAt=dateStr()+' '+timeStr();
  alert('Invoice '+id+' marked as Paid.');
  closeModal('inv-modal');
  renderInvoices();
}

function saveClient() {
  const name=document.getElementById('cl-name').value.trim();

  clients.push({id:uid(),name,phone,email:document.getElementById('cl-email').value.trim(),event:document.getElementById('cl-event').value.trim(),notes:document.getElementById('cl-notes').value.trim(),createdAt:dateStr()});

// ── REPORTS ───────────────────────────────────────────────
function renderReports() {
  const total=invoices.reduce((a,i)=>a+i.total,0);
  const unpaid=invoices.filter(i=>i.status==='Unpaid').reduce((a,i)=>a+i.total,0);
  const paid=total-unpaid;

  const deptTotals={},deptCounts={};
  invoices.forEach(inv=>inv.items.forEach(item=>{
    deptTotals[item.dept]=(deptTotals[item.dept]||0)+item.price*item.qty;
    deptCounts[item.dept]=(deptCounts[item.dept]||0)+item.qty;
  }));

  const clientRev={};
  invoices.forEach(inv=>{ clientRev[inv.clientName]=(clientRev[inv.clientName]||0)+inv.total; });
  const topClients=Object.entries(clientRev).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const pmTotals={};
  invoices.forEach(i=>{ pmTotals[i.payMethod]=(pmTotals[i.payMethod]||0)+i.total; });

  document.getElementById('page-reports').innerHTML = `
    <div class="stats-grid" style="margin-bottom:14px">
      <div class="stat-card" style="border-top-color:var(--red)"><div class="stat-label">Total Revenue</div><div class="stat-value">${fmt(total)}</div></div>
      <div class="stat-card" style="border-top-color:var(--green)"><div class="stat-label">Paid</div><div class="stat-value">${fmt(paid)}</div></div>
      <div class="stat-card" style="border-top-color:var(--amber)"><div class="stat-label">Unpaid</div><div class="stat-value">${fmt(unpaid)}</div></div>
      <div class="stat-card" style="border-top-color:var(--blue)"><div class="stat-label">Invoices</div><div class="stat-value">${invoices.length}</div></div>
      <div class="stat-card" style="border-top-color:var(--purple)"><div class="stat-label">Clients Served</div><div class="stat-value">${new Set(invoices.map(i=>i.clientName)).size}</div></div>
    </div>
    <div style="font-size:12px;font-weight:600;margin-bottom:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">Department Revenue Breakdown</div>
    <div class="dept-cards">
      ${DEPTS.map(d=>{
        const val=deptTotals[d.id]||0;
        const cnt=deptCounts[d.id]||0;
        return `<div class="dept-card" style="border-left-color:${d.color}">
          <div class="dept-card-name"><i class="ti ${d.icon}" style="color:${d.color}"></i> ${d.name}</div>
          <div class="dept-card-val">${fmt(val)}</div>
          <div class="dept-card-sub">${cnt} item${cnt!==1?'s':''} sold</div>
        </div>`;
      }).join('')}
    </div>
    <div class="two-col">
      <div class="card">
        <div class="card-title"><i class="ti ti-trophy" style="color:var(--amber)"></i> Top Clients</div>
        ${!topClients.length?'<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px">No data yet</div>':
          topClients.map(([name,val],i)=>`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)">
            <div style="width:22px;height:22px;border-radius:50%;background:${['var(--amber)','#888','#cd7f32','var(--muted)','var(--muted)','var(--muted)'][i]||'var(--muted)'};display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#000;flex-shrink:0">${i+1}</div>
            <span style="flex:1;font-size:12px">${name}</span>
            <span style="font-size:12px;font-weight:600">${fmt(val)}</span>
          </div>`).join('')}
      </div>
      <div class="card">
        <div class="card-title"><i class="ti ti-credit-card" style="color:var(--blue)"></i> Payment Methods</div>
        ${!Object.keys(pmTotals).length?'<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px">No data yet</div>':
          Object.entries(pmTotals).map(([pm,val])=>{
            const icons={cash:'ti-cash',mpesa:'ti-device-mobile',bank:'ti-building-bank',credit:'ti-clock'};
            const cols={cash:'var(--green)',mpesa:'#4ade80',bank:'var(--blue)',credit:'var(--amber)'};
            return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)">
              <i class="ti ${icons[pm]||'ti-cash'}" style="color:${cols[pm]||'#888'};font-size:16px"></i>
              <span style="flex:1;font-size:12px;text-transform:capitalize">${pm}</span>
              <span style="font-size:12px;font-weight:600">${fmt(val)}</span>
            </div>`;
          }).join('')}
      </div>
    </div>`;
}
