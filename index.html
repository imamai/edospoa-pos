<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mejasan POS — Point of Sale</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --gold: #C9A84C;
    --gold-light: #e8c96a;
    --gold-dark: #a07c30;
    --black: #0a0a0a;
    --dark: #111111;
    --dark2: #1a1a1a;
    --dark3: #222222;
    --surface: #181818;
    --border: #2a2a2a;
    --text: #f0ece4;
    --text-muted: #888888;
    --text-dim: #555555;
    --red: #e05252;
    --green: #4caf7d;
    --blue: #4c8faf;
    --r: 6px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Outfit', sans-serif;
    background: var(--black);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--dark);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 58px;
    flex-shrink: 0;
    z-index: 100;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-area img { height: 32px; filter: brightness(1.1); }
  .logo-tagline { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; text-transform: uppercase; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar-clock { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--gold); letter-spacing: 1px; }
  .cashier-badge {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--text-muted);
  }
  .cashier-badge span { color: var(--gold); font-weight: 600; }

  /* ── MAIN LAYOUT ── */
  .main {
    display: grid;
    grid-template-columns: 1fr 400px;
    flex: 1;
    overflow: hidden;
    gap: 0;
  }

  /* ── LEFT: PRODUCTS ── */
  .products-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-right: 1px solid var(--border);
  }
  .products-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    background: var(--surface);
  }
  .search-box {
    flex: 1;
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 8px 14px 8px 36px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    position: relative;
  }
  .search-wrap { position: relative; flex: 1; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); opacity: .4; }
  .search-box:focus { border-color: var(--gold); }
  .cat-tabs {
    display: flex;
    gap: 6px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
    background: var(--dark);
    scrollbar-width: none;
  }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab {
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: all .18s;
  }
  .cat-tab.active, .cat-tab:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--black);
    font-weight: 600;
  }
  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
    gap: 10px;
    padding: 14px;
    overflow-y: auto;
    align-content: start;
  }
  .products-grid::-webkit-scrollbar { width: 4px; }
  .products-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .product-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 14px 12px 12px;
    cursor: pointer;
    transition: all .18s;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .product-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--cat-color, var(--gold));
    opacity: 0;
    transition: opacity .18s;
  }
  .product-card:hover { border-color: var(--gold); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(201,168,76,.12); }
  .product-card:hover::before { opacity: 1; }
  .product-card:active { transform: scale(.97); }
  .product-icon { font-size: 22px; line-height: 1; }
  .product-name { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.3; }
  .product-sub { font-size: 11px; color: var(--text-muted); }
  .product-price { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--gold); font-weight: 500; margin-top: auto; }
  .product-badge {
    position: absolute;
    top: 6px; right: 6px;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 9px;
    padding: 1px 5px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: .5px;
  }

  /* ── RIGHT: CART ── */
  .cart-panel {
    display: flex;
    flex-direction: column;
    background: var(--dark);
    overflow: hidden;
  }
  .cart-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .cart-title { font-family: 'DM Serif Display', serif; font-size: 16px; color: var(--gold); }
  .cart-count { background: var(--gold); color: var(--black); font-size: 11px; font-weight: 700; border-radius: 10px; padding: 1px 7px; }
  .btn-clear { background: none; border: 1px solid var(--border); border-radius: var(--r); padding: 4px 10px; color: var(--text-dim); font-size: 11px; cursor: pointer; font-family: 'Outfit', sans-serif; transition: all .18s; }
  .btn-clear:hover { border-color: var(--red); color: var(--red); }

  .cart-items {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cart-items::-webkit-scrollbar { width: 3px; }
  .cart-items::-webkit-scrollbar-thumb { background: var(--border); }

  .cart-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 13px;
    gap: 10px;
    padding: 20px;
    text-align: center;
  }
  .cart-empty .empty-icon { font-size: 36px; opacity: .3; }

  .cart-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 10px 12px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px;
    animation: slideIn .15s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
  .ci-name { font-size: 13px; font-weight: 500; }
  .ci-sub { font-size: 11px; color: var(--text-muted); }
  .ci-price { font-family: 'DM Mono', monospace; font-size: 13px; color: var(--gold); text-align: right; }
  .ci-controls { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .qty-btn { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--border); background: var(--dark2); color: var(--text); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .qty-btn:hover { border-color: var(--gold); color: var(--gold); }
  .qty-val { font-family: 'DM Mono', monospace; font-size: 13px; min-width: 20px; text-align: center; }
  .ci-remove { width: 22px; height: 22px; border-radius: 4px; border: 1px solid transparent; background: none; color: var(--text-dim); font-size: 14px; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; }
  .ci-remove:hover { border-color: var(--red); color: var(--red); }
  .ci-note { grid-column: 1/-1; }
  .ci-note input {
    width: 100%;
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 11px;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    outline: none;
  }
  .ci-note input:focus { border-color: var(--gold); color: var(--text); }

  /* ── TOTALS ── */
  .cart-totals {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }
  .total-row { display: flex; justify-content: space-between; font-size: 13px; }
  .total-row.main { font-size: 18px; font-weight: 700; margin-top: 4px; border-top: 1px solid var(--border); padding-top: 8px; }
  .total-row.main .amt { font-family: 'DM Mono', monospace; color: var(--gold); }
  .total-row .lbl { color: var(--text-muted); }
  .total-row .amt { font-family: 'DM Mono', monospace; }

  /* ── CUSTOMER ── */
  .customer-bar {
    border-top: 1px solid var(--border);
    padding: 10px 16px;
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .cust-input {
    flex: 1;
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 7px 12px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
  }
  .cust-input:focus { border-color: var(--gold); }
  .cust-input::placeholder { color: var(--text-dim); }

  /* ── PAYMENT BUTTONS ── */
  .pay-section {
    padding: 10px 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .pay-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn-pay {
    padding: 11px 10px;
    border-radius: var(--r);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all .18s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn-pay:hover { border-color: var(--gold); color: var(--gold); }
  .btn-mpesa {
    background: #04a04a;
    border-color: #04a04a;
    color: #fff;
    grid-column: 1 / -1;
    padding: 13px;
    font-size: 14px;
  }
  .btn-mpesa:hover { background: #038a3f; border-color: #038a3f; color: #fff; }
  .mpesa-logo { font-size: 11px; font-weight: 700; letter-spacing: 1px; background: #fff; color: #04a04a; border-radius: 3px; padding: 1px 5px; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.85);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    animation: fadeIn .2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 420px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
    animation: popIn .2s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
  .modal-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--gold); }
  .modal-close { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; line-height: 1; }
  .modal-close:hover { color: var(--red); }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }

  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
  .form-input {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
    width: 100%;
  }
  .form-input:focus { border-color: var(--gold); }
  .form-select {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    outline: none;
    width: 100%;
  }
  .form-select option { background: var(--dark2); }

  .btn-primary {
    flex: 1;
    padding: 12px;
    background: var(--gold);
    border: none;
    border-radius: var(--r);
    color: var(--black);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all .18s;
  }
  .btn-primary:hover { background: var(--gold-light); }
  .btn-secondary {
    padding: 12px 20px;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--r);
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all .18s;
  }
  .btn-secondary:hover { border-color: var(--text-muted); color: var(--text); }

  /* ── STK STATUS ── */
  .stk-status {
    text-align: center;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .stk-phone-display {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    color: var(--gold);
    letter-spacing: 2px;
  }
  .stk-amount {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--text);
  }
  .stk-spinner {
    width: 44px; height: 44px;
    border: 3px solid var(--border);
    border-top-color: #04a04a;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stk-msg { font-size: 13px; color: var(--text-muted); text-align: center; line-height: 1.6; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot-green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .dot-red { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .dot-yellow { background: var(--gold); box-shadow: 0 0 6px var(--gold); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .stk-success { color: var(--green); font-size: 40px; }
  .stk-fail { color: var(--red); font-size: 40px; }

  /* ── RECEIPT ── */
  .receipt {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 16px;
    line-height: 1.8;
  }
  .receipt-divider { border: none; border-top: 1px dashed var(--border); margin: 8px 0; }
  .receipt-row { display: flex; justify-content: space-between; }
  .receipt-center { text-align: center; color: var(--text-muted); }
  .receipt-title { text-align: center; color: var(--gold); font-size: 13px; font-weight: 700; letter-spacing: 2px; }

  /* ── TOAST ── */
  .toast-container { position: fixed; top: 70px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    border-radius: var(--r);
    padding: 10px 16px;
    font-size: 13px;
    animation: toastIn .2s ease, toastOut .3s ease 2.7s forwards;
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 220px;
    box-shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  .toast.success { border-left-color: var(--green); }
  .toast.error { border-left-color: var(--red); }
  @keyframes toastIn { from{opacity:0;transform:translateX(20px);} to{opacity:1;transform:translateX(0);} }
  @keyframes toastOut { to{opacity:0;transform:translateX(20px);} }

  /* ── DISCOUNT ── */
  .discount-row {
    display: flex; gap: 8px; align-items: center;
  }
  .discount-row input { flex: 1; }
  .discount-type {
    background: var(--dark3); border: 1px solid var(--border); border-radius: var(--r);
    padding: 10px 10px; color: var(--text); font-family: 'Outfit',sans-serif; font-size:13px; outline:none;
  }

  /* ── NAV TABS bottom of left ── */
  .view-tabs {
    display: flex;
    border-top: 1px solid var(--border);
    background: var(--dark);
    flex-shrink: 0;
  }
  .view-tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: none;
    color: var(--text-dim);
    font-family: 'Outfit',sans-serif;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: color .18s;
    border-top: 2px solid transparent;
  }
  .view-tab.active, .view-tab:hover { color: var(--gold); border-top-color: var(--gold); }
  .view-tab svg { width: 16px; height: 16px; }

  /* ── SALES LOG ── */
  .sales-log { flex:1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .sale-entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 4px;
  }
  .sale-entry .se-name { font-size:13px; font-weight:600; }
  .sale-entry .se-time { font-size:11px; color:var(--text-muted); }
  .sale-entry .se-amount { font-family:'DM Mono',monospace; font-size:14px; color:var(--gold); text-align:right; }
  .sale-entry .se-method { font-size:10px; color:var(--text-dim); text-align:right; }
  .log-summary {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: var(--r);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }

  .no-data { padding: 40px; text-align:center; color:var(--text-dim); font-size:13px; }
</style>
</head>
<body>

<!-- TOPBAR -->

const CATEGORIES = ['All', ...new Set(PRODUCTS.map(p => p.cat))];
let activeCategory = 'All';
let cart = [];
let discount = { type: 'none', value: 0 };
let salesLog = [];
let txRef = 0;

// ── INIT ──────────────────────────────────────────────────
function init() {
  renderCatTabs();
  renderProducts();
  startClock();
}

function startClock() {
  const update = () => {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('en-KE', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
  };
  update();
  setInterval(update, 1000);
}

// ── CATEGORIES ─────────────────────────────────────────────
function renderCatTabs() {
  const el = document.getElementById('catTabs');
  el.innerHTML = CATEGORIES.map(c =>
    `<button class="cat-tab${c===activeCategory?' active':''}" onclick="setCategory('${c}')">${c}</button>`
  ).join('');
}

function setCategory(cat) {
  activeCategory = cat;
  renderCatTabs();
  filterProducts();
}

// ── PRODUCTS ───────────────────────────────────────────────
function filterProducts() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = PRODUCTS.filter(p => {
    const matchCat = activeCategory === 'All' || p.cat === activeCategory;
    const matchQ = !q || p.name.toLowerCase().includes(q) || p.sub.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  renderProducts(filtered);
}

function renderProducts(list = PRODUCTS) {
  const grid = document.getElementById('productsGrid');
  const catColors = { Photography:'#C9A84C', Videography:'#4c8faf', Drone:'#4caf7d', Packages:'#e05252', 'Add-ons':'#9b6fe8' };
  grid.innerHTML = list.map(p => `
    <div class="product-card" onclick="addToCart('${p.id}')" style="--cat-color:${catColors[p.cat]||'var(--gold)'}">
      ${p.badge ? `<span class="product-badge">${p.badge}</span>` : ''}
      <div class="product-icon">${p.icon}</div>
      <div class="product-name">${p.name}</div>
      <div class="product-sub">${p.sub}</div>
      <div class="product-price">KES ${p.price.toLocaleString()} <span style="font-size:10px;color:var(--text-dim);">/ ${p.unit}</span></div>
    </div>
  `).join('');
}

// ── CART ──────────────────────────────────────────────────
function addToCart(id) {
  const product = PRODUCTS.find(p => p.id === id);
  if (!product) return;
  const existing = cart.find(c => c.id === id);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ ...product, qty: 1, note: '' });
  }
  renderCart();
  showToast(`${product.icon} ${product.name} added`, 'success');
}

function removeFromCart(id) {
  cart = cart.filter(c => c.id !== id);
  renderCart();
}

function changeQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty = Math.max(1, item.qty + delta);
  renderCart();
}

function updateNote(id, val) {
  const item = cart.find(c => c.id === id);
  if (item) item.note = val;
}

function clearCart() {
  cart = [];
  discount = { type: 'none', value: 0 };
  renderCart();
}

function renderCart() {
  const el = document.getElementById('cartItems');
  const totalsEl = document.getElementById('cartTotals');
  document.getElementById('cartCount').textContent = cart.reduce((s,c)=>s+c.qty,0);

  if (!cart.length) {
    el.innerHTML = `<div class="cart-empty"><div class="empty-icon">🎬</div><div>Add products to start an order</div></div>`;
    totalsEl.style.display = 'none';
    return;
  }

  el.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div>
        <div class="ci-name">${item.icon} ${item.name}</div>
        <div class="ci-sub">${item.sub}</div>
        <div class="ci-controls">
          <button class="qty-btn" onclick="changeQty('${item.id}',-1)">−</button>
          <span class="qty-val">${item.qty}</span>
          <button class="qty-btn" onclick="changeQty('${item.id}',1)">+</button>
        </div>
      </div>
      <div>
        <div class="ci-price">KES ${(item.price*item.qty).toLocaleString()}</div>
        <button class="ci-remove" onclick="removeFromCart('${item.id}')">✕</button>
      </div>
      <div class="ci-note">
        <input placeholder="Note (optional)…" value="${item.note||''}" oninput="updateNote('${item.id}',this.value)"/>
      </div>
    </div>
  `).join('');

  totalsEl.style.display = 'flex';
  const sub = cart.reduce((s,c)=>s+c.price*c.qty,0);
  let disc = 0;
  if (discount.type === 'percent') disc = Math.round(sub * discount.value / 100);
  if (discount.type === 'fixed') disc = Math.min(discount.value, sub);
  const total = sub - disc;

  document.getElementById('subtotal').textContent = `KES ${sub.toLocaleString()}`;
  document.getElementById('discountAmt').textContent = disc > 0 ? `−KES ${disc.toLocaleString()}` : '—';
  document.getElementById('totalAmt').textContent = `KES ${total.toLocaleString()}`;
}

function getTotal() {
  const sub = cart.reduce((s,c)=>s+c.price*c.qty,0);
  let disc = 0;
  if (discount.type === 'percent') disc = Math.round(sub * discount.value / 100);
  if (discount.type === 'fixed') disc = Math.min(discount.value, sub);
  return { sub, disc, total: sub - disc };
}

function calcChange(total) {
  const tendered = parseFloat(document.getElementById('cashTendered').value)||0;
  const change = tendered - total;
  const el = document.getElementById('changeDisplay');
  if (tendered > 0) {
    el.textContent = change >= 0 ? `Change: KES ${change.toLocaleString()}` : `Short by: KES ${Math.abs(change).toLocaleString()}`;
    el.style.color = change >= 0 ? 'var(--green)' : 'var(--red)';
  } else { el.textContent = ''; }
}

function closePayModal(e) { if(e.target===document.getElementById('payModal')) closePayModalDirect(); }
function closePayModalDirect() { document.getElementById('payModal').style.display = 'none'; }

function confirmPayment(method) {
  const { total } = getTotal();
  closePayModalDirect();
  recordSale(method, total);
  showReceipt(method, total);
}

function formatPhone(phone) {
  phone = phone.replace(/\D/g,'');
  if (phone.startsWith('0')) phone = '254'+phone.slice(1);
  if (phone.startsWith('7') || phone.startsWith('1')) phone = '254'+phone;
  return phone;
}

function sendSTK(total) {
  const rawPhone = document.getElementById('mpesaPhone').value.trim();
  if (!rawPhone) { showToast('Enter a phone number', 'error'); return; }
  const phone = formatPhone(rawPhone);

  // Show loading state
  document.getElementById('mpesaBody').innerHTML = `
    <div class="stk-status">
      <div class="stk-spinner"></div>
      <div class="stk-phone-display">+${phone}</div>
      <div class="stk-amount">KES ${total.toLocaleString()}</div>
      <div class="stk-msg">
        <span class="status-dot dot-yellow"></span>
        &nbsp;STK Push sent! Waiting for client to enter PIN on their phone…
      </div>

  // Simulate STK push to your backend

  /*
  fetch('https://your-backend.com/api/mpesa/stk', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ phone, amount: total, ref: 'MEJASAN-' + Date.now() })
  }).then(r => r.json()).then(data => {
    if (data.ResponseCode === '0') pollSTKStatus(data.CheckoutRequestID, total, phone);
    else onSTKFail('STK push failed. Try again.');
  }).catch(() => onSTKFail('Network error. Check connection.'));
  */

  // DEMO: simulate success after 4 seconds
  setTimeout(() => {

    if (success) {
      const mpesaCode = 'QGH' + Math.random().toString(36).slice(2,8).toUpperCase();
      onSTKSuccess(mpesaCode, total, phone);

      onSTKFail('Client cancelled or timeout. Request the client to try again.');
    }
  }, 4000);
}

  const custName = document.getElementById('custName').value || 'Walk-in';
  salesLog.unshift({
    name: custName,
    items: [...cart],
    method,
    total,
    time: new Date(),
  });
}

function switchView(view, btn) {
  document.querySelectorAll('.view-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  const grid = document.getElementById('productsGrid');
  const catTabs = document.getElementById('catTabs');
  const searchWrap = document.querySelector('.search-wrap');

  if (view === 'pos') {
    grid.style.display = '';
    catTabs.style.display = '';
    searchWrap.style.display = '';
    renderProducts();
  } else if (view === 'sales') {
    catTabs.style.display = 'none';
    searchWrap.style.display = 'none';
    grid.innerHTML = renderSalesLog();
    grid.style.display = 'block';
    grid.style.overflowY = 'auto';
  } else if (view === 'packages') {
    catTabs.style.display = 'none';
    searchWrap.style.display = 'none';
    activeCategory = 'Packages';
    grid.style.display = '';
    renderProducts(PRODUCTS.filter(p => p.cat === 'Packages'));
  }
}

function renderSalesLog() {
  if (!salesLog.length) return `<div class="no-data">No sales recorded yet this session.</div>`;
  const dayTotal = salesLog.reduce((s,l)=>s+l.total, 0);
  const rows = salesLog.map(s => `
    <div class="sale-entry">
      <div>
        <div class="se-name">${s.name}</div>
        <div class="se-time">${s.items.length} item(s) · ${s.time.toLocaleTimeString('en-KE')}</div>
      </div>
      <div>
        <div class="se-amount">KES ${s.total.toLocaleString()}</div>
        <div class="se-method">${s.method}</div>
      </div>
    </div>
  `).join('');
  return `
    <div style="padding:14px;display:flex;flex-direction:column;gap:8px;height:100%;overflow-y:auto;">
      <div class="log-summary">
        <div>
          <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;">Today's Sales</div>
          <div style="font-size:20px;font-weight:700;color:var(--gold);font-family:'DM Mono',monospace;">KES ${dayTotal.toLocaleString()}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:11px;color:var(--text-muted);">Transactions</div>
          <div style="font-size:20px;font-weight:700;">${salesLog.length}</div>
        </div>
      </div>
      ${rows}
    </div>
  `;
}

// ── TOAST ─────────────────────────────────────────────────
function showToast(msg, type='info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success:'✓', error:'✕', info:'ℹ' };
  el.innerHTML = `<span>${icons[type]||'ℹ'}</span><span>${msg}</span>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

init();
</script>
